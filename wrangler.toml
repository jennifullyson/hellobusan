name = "hellobusan"
main = "src/worker.js"
compatibility_date = "2026-09-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "thesonlab.com"
